name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Run php -l on every PHP file
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l
